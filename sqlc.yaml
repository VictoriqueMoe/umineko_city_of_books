version: "2"
sql:
  - engine: postgresql
    schema: internal/db/migrations
    queries:
      - internal/dao/queries
      - internal/dao/queries/gen
    gen:
      go:
        package: sqlcgen
        out: internal/dao/sqlcgen
        sql_package: database/sql
        sql_driver: github.com/jackc/pgx/v5
        emit_interface: false
        emit_empty_slices: true
        emit_pointers_for_null_types: true
        overrides:
          - db_type: uuid
            go_type: github.com/google/uuid.UUID
          - db_type: uuid
            nullable: true
            go_type:
              import: github.com/google/uuid
              type: UUID
              pointer: true
          - db_type: citext
            go_type: string
          - db_type: citext
            nullable: true
            go_type:
              type: string
              pointer: true
