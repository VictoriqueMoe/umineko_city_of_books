name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  docs:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: lts/*

      - name: Check markdown links
        run: node scripts/check-links.mjs

  frontend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: lts/*
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install frontend dependencies
        run: cd frontend && npm ci

      - name: Format
        run: cd frontend && npm run format

      - name: Lint
        run: cd frontend && npm run lint

      - name: Test
        run: cd frontend && npm run test:coverage

      - name: Build frontend
        run: cd frontend && npm run build

  backend-lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Create static placeholder
        run: mkdir -p static && touch static/.gitkeep

      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
          cache: false

      - uses: actions/cache@v6
        with:
          path: |
            ~/.cache/go-build
            ~/go/pkg/mod
          key: go-${{ runner.os }}-${{ hashFiles('go.sum') }}
          restore-keys: go-${{ runner.os }}-

      - name: Vet
        run: go vet ./...

      - name: Staticcheck
        run: go tool staticcheck ./...

      - name: Check generated code is up to date
        run: |
          ./scripts/regen_sqlc.sh
          ./scripts/regen_mocks.sh
          git add -A
          git diff --cached --exit-code

      - name: Build
        run: go build ./...

  backend-test:
    name: ${{ matrix.shard == 'rest' && 'backend-test (all other packages)' || format('backend-test (dao {0} of 4)', matrix.shard) }}
    if: ${{ !contains(github.event.head_commit.message, '[skip tests]') }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        shard: ["1", "2", "3", "4", "rest"]
    steps:
      - uses: actions/checkout@v7

      - name: Create static placeholder
        run: mkdir -p static && touch static/.gitkeep

      - name: Install media tools
        if: matrix.shard == 'rest'
        run: sudo apt-get update && sudo apt-get install -y webp

      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
          cache: false

      - uses: actions/cache/restore@v6
        with:
          path: |
            ~/.cache/go-build
            ~/go/pkg/mod
          key: go-${{ runner.os }}-${{ hashFiles('go.sum') }}
          restore-keys: go-${{ runner.os }}-

      - name: Test this job's share of the DAO package
        if: matrix.shard != 'rest'
        env:
          SHARD: ${{ matrix.shard }}
        run: |
          set -euo pipefail
          tests=$(go test -list '^Test' ./internal/dao | grep '^Test' | sort | awk -v shards=4 -v shard="$SHARD" 'NR % shards == shard - 1' | paste -sd '|')
          pattern="^(${tests})\$"
          go test ./internal/dao -count=1 -run "$pattern"

      - name: Test everything except the DAO package
        if: matrix.shard == 'rest'
        run: go test $(go list ./... | grep -v '/internal/dao$') -count=1

  backend:
    if: ${{ always() }}
    needs: [backend-lint, backend-test]
    runs-on: ubuntu-latest
    steps:
      - name: Require every backend job to pass
        run: |
          echo "lint: ${{ needs.backend-lint.result }}, tests: ${{ needs.backend-test.result }}"
          [ "${{ needs.backend-lint.result }}" = "success" ]
          [[ "${{ needs.backend-test.result }}" =~ ^(success|skipped)$ ]]
